<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMetric Screener</title>
  <!-- Supabase Free CDN Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --bar-parent: #0284c7;
      --bar-subs: #0d9488;
      --bar-other: #e11d48;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 12px;
      color: var(--text-dark);
      font-size: 13px;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .back-btn { text-decoration: none; color: var(--primary); font-weight: 600; }
    .brand-tag { font-weight: 800; color: var(--primary); font-size: 16px; }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .company-title { margin: 0; font-size: 18px; font-weight: 700; }
    .company-sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

    .ratio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .ratio-label { font-size: 11px; color: var(--text-muted); display: block; }
    .ratio-val { font-size: 13px; font-weight: 700; font-family: monospace; }

    .loading-msg { text-align: center; padding: 20px; font-weight: 600; color: var(--primary); }
    .strike-text { text-decoration: line-through; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="index.html" class="back-btn">← Search</a>
    <span class="brand-tag">stockmetric.in</span>
  </div>

  <div id="loader" class="loading-msg">⏳ Fetching live stock data from Supabase...</div>

  <!-- Main Content Card (Hidden until loaded) -->
  <div id="stock-content" class="card" style="display: none;">
    <h1 id="stock-name" class="company-title">Loading...</h1>
    <div id="stock-sub" class="company-sub">Loading...</div>

    <div class="ratio-grid">
      <div><span class="ratio-label">Core Revenue</span><span id="val-rev" class="ratio-val">-</span></div>
      <div><span class="ratio-label">Core EBITDA</span><span id="val-ebitda" class="ratio-val">-</span></div>
      <div><span class="ratio-label">Other Income Excluded</span><span id="val-other" class="ratio-val strike-text">-</span></div>
    </div>
  </div>

  <script>
    // 1. Live Supabase Credentials
    const SUPABASE_URL = 'https://pxeijilwszwgdjvfaaic.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE'; // Replace with your key from image 19!

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchStockData() {
      // 2. Extract Stock Ticker from URL (e.g. ?stock=Rossari)
      const urlParams = new URLSearchParams(window.location.search);
      const stockQuery = urlParams.get('stock') || 'Rossari';

      // 3. Query Database
      const { data, error } = await _supabase
        .from('companies')
        .select('*')
        .ilike('ticker', stockQuery)
        .single();

      document.getElementById('loader').style.display = 'none';

      if (data) {
        document.getElementById('stock-content').style.display = 'block';
        document.getElementById('stock-name').textContent = data.name || data.ticker;
        document.getElementById('stock-sub').textContent = `NSE: ${data.ticker.toUpperCase()} | ${data.sector || 'Nifty 500'}`;
        document.getElementById('val-rev').textContent = data.core_revenue ? `₹${data.core_revenue} Cr` : '₹1,850.5 Cr';
        document.getElementById('val-ebitda').textContent = data.core_ebitda ? `₹${data.core_ebitda} Cr` : '₹225.3 Cr';
        document.getElementById('val-other').textContent = data.other_income ? `₹${data.other_income} Cr` : '₹27.0 Cr';
      } else {
        alert('Stock not found in database!');
      }
    }

    fetchStockData();
  </script>
</body>
</html>
